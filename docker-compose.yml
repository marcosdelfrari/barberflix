services:
  postgres:
    image: postgres:16-alpine
    container_name: barberflix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barberflix
    ports:
      - "5434:5432"
    volumes:
      - barberflix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barberflix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  barberflix_postgres_data:
