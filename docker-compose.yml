services:
  postgres:
    image: postgres:16-alpine
    container_name: Barbearia Cavalheiros-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Barbearia Cavalheiros
    ports:
      - "5434:5432"
    volumes:
      - Barbearia Cavalheiros_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Barbearia Cavalheiros"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  Barbearia Cavalheiros_postgres_data:
